name: commits
on:
  pull_request:
  push:
    branches: [main]
jobs:
  conventional:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Check each commit message
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] && base=$(git rev-list --max-parents=0 HEAD)
          fail=0
          for sha in $(git rev-list "$base..HEAD"); do
            git log -1 --format=%B "$sha" > /tmp/msg
            .githooks/commit-msg /tmp/msg || { echo "  in $sha"; fail=1; }
          done
          exit $fail
